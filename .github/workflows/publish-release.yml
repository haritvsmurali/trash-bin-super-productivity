name: Publish plugin release

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "plugin.js"
      - "index.html"
      - "icon.svg"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric version matching manifest.json (blank uses manifest version)"
        required: false
        type: string
        default: "1.0.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate and build plugin ZIP
        id: package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          MANIFEST_ID="$(node -p "require('./manifest.json').id")"
          VERSION="${REQUESTED_VERSION:-$MANIFEST_VERSION}"
          if [[ "$MANIFEST_ID" != "trash-bin" ]]; then
            echo "Unexpected plugin id: $MANIFEST_ID" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Requested version $VERSION does not match manifest version $MANIFEST_VERSION" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Version must be numeric, for example 1.0.1" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists; skipping publication."
            echo "Release v$VERSION already exists; no asset was changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "already_exists=false" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          zip -X -9 -j dist/plugin.zip manifest.json plugin.js index.html icon.svg
          unzip -t dist/plugin.zip
          SHA="$(sha256sum dist/plugin.zip | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Trash Bin v$VERSION"
            echo
            echo "- Plugin ID: `$MANIFEST_ID`"
            echo "- ZIP SHA-256: `$SHA`"
            echo "- Asset name: `plugin.zip`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release and upload plugin ZIP
        if: steps.package.outputs.already_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/plugin.zip \
            --title "Trash Bin v${VERSION}" \
            --target main \
            --notes "Trash Bin plugin for Super Productivity. This is a best-effort deleted-task recovery archive: task restoration creates a new task and cannot guarantee recovery of recurrence settings, timer history, original IDs, or all relationships. Projects, tags and saved filters are not fully recoverable through the documented public plugin API. Back up your data and test with sample data first."
